# ==============================================================================
# OctoLAN - Universal Compose File (Podman & Docker)
# ==============================================================================
services:
  octolan:
    image: octolan:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: octolan
    restart: unless-stopped
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
