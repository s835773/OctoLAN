# ==============================================================================
# OctoLAN - Podman Compose Configuration (Rootless & Standard)
# ==============================================================================
version: '3.8'

services:
  octolan-console:
    image: localhost/octolan:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: octolan-console
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      io.containers.autoupdate: registry
      app: octolan-network-suite
