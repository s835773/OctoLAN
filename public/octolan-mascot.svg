<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Vibrant Green Background Badge -->
  <rect width="400" height="400" rx="80" fill="#238636" />
  <circle cx="200" cy="200" r="175" fill="#2ea043" />
  
  <!-- Subtle Green Accent Ring -->
  <circle cx="200" cy="200" r="162" fill="none" stroke="#3fb950" stroke-width="4" opacity="0.6" stroke-dasharray="12 8" />

  <!-- Inky the Cartoon Octopus (Solid Black Monochrome Mascot) -->
  <g fill="#0d1117" stroke="#0d1117" stroke-linejoin="round" stroke-linecap="round">
    <!-- 8 Cartoon Tentacles -->
    <!-- Tentacle 1: Upper Left Wave -->
    <path d="M 145 225 C 105 210, 55 175, 45 130 C 40 108, 65 98, 80 115 C 96 132, 112 170, 150 205 Z" stroke-width="4" />
    
    <!-- Tentacle 2: Mid-Left Reach -->
    <path d="M 135 245 C 85 240, 35 215, 25 250 C 20 272, 45 285, 75 278 C 105 272, 128 258, 146 250 Z" stroke-width="4" />
    
    <!-- Tentacle 3: Lower-Left Curl -->
    <path d="M 150 270 C 115 292, 65 328, 78 355 C 88 375, 118 360, 128 338 C 142 312, 156 290, 166 280 Z" stroke-width="4" />
    
    <!-- Tentacle 4: Center-Left Foot -->
    <path d="M 172 282 C 156 316, 146 358, 168 372 C 184 382, 196 360, 196 332 C 196 306, 190 286, 186 282 Z" stroke-width="4" />
    
    <!-- Tentacle 5: Center-Right Foot -->
    <path d="M 214 282 C 210 286, 204 306, 204 332 C 204 360, 216 382, 232 372 C 254 358, 244 316, 228 282 Z" stroke-width="4" />
    
    <!-- Tentacle 6: Lower-Right Curl -->
    <path d="M 234 280 C 244 290, 258 312, 272 338 C 282 360, 312 375, 322 355 C 335 328, 285 292, 250 270 Z" stroke-width="4" />
    
    <!-- Tentacle 7: Mid-Right Reach -->
    <path d="M 254 250 C 272 258, 295 272, 325 278 C 355 285, 380 272, 375 250 C 365 215, 315 240, 265 245 Z" stroke-width="4" />
    
    <!-- Tentacle 8: Upper Right Wave -->
    <path d="M 250 205 C 288 170, 304 132, 320 115 C 335 98, 360 108, 355 130 C 345 175, 295 210, 255 225 Z" stroke-width="4" />

    <!-- Big Smooth Cartoon Head / Mantle -->
    <path d="M 125 215 C 112 150, 135 75, 200 75 C 265 75, 288 150, 275 215 C 270 252, 248 282, 200 282 C 152 282, 130 252, 125 215 Z" stroke-width="4" />
  </g>

  <!-- Big Cute White Cartoon Eyes -->
  <ellipse cx="166" cy="178" rx="22" ry="26" fill="#ffffff" />
  <ellipse cx="234" cy="178" rx="22" ry="26" fill="#ffffff" />

  <!-- Black Pupils Looking Forward/Happy -->
  <ellipse cx="170" cy="180" rx="13" ry="16" fill="#0d1117" />
  <ellipse cx="230" cy="180" rx="13" ry="16" fill="#0d1117" />

  <!-- Crisp White Catchlight Reflections -->
  <circle cx="164" cy="172" r="5.5" fill="#ffffff" />
  <circle cx="224" cy="172" r="5.5" fill="#ffffff" />
  <circle cx="174" cy="186" r="2.5" fill="#ffffff" />
  <circle cx="234" cy="186" r="2.5" fill="#ffffff" />

  <!-- Happy Cartoon Smile -->
  <path d="M 188 222 Q 200 236 212 222" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Cute Blush Cheeks -->
  <ellipse cx="140" cy="208" rx="8" ry="4.5" fill="#3fb950" opacity="0.8" />
  <ellipse cx="260" cy="208" rx="8" ry="4.5" fill="#3fb950" opacity="0.8" />
</svg>
